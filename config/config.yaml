# UI control: which front-ends to bring up on launch.
ui:
    display:   false     # native cv::imshow GUI window (node_gui composite)
    dashboard: true     # auto-open Chromium in kiosk mode to the dashboard URL

# Single-eye topic routing for downstream consumers (detect/lanedet/gui/dashboard).
# stereo_depth ignores this and always uses both eyes.
stereo:
    main_eye: "left"    # "left" or "right" — flipped from "right" after the
                        # physical sensor swap; downstream nodes (detect,
                        # lanedet, gui, dashboard) consume this topic. Verify
                        # the eye actually looks right once depth is recalibrated.

camera:
    ros__parameters:
        resource:           "csi://0"   # IMX219 CSI mono cam for driver monitor
        width:              1280
        height:             720

camera_stereo:
    ros__parameters:
        resource:           "/dev/video1"   # Arducam stereo
        width:              3840        # full stereo (1920 L + 1920 R)
        height:             1200
        framerate:          30
        # rotated_lenses=false → 1440×900 per eye (inner-edge horizontal crop +
        # symmetric vertical crop). true → 1200×1200 (90° per-eye rotation).
        rotated_lenses:     false
        cuda_flip:          "rotate-180" # "rotate-180" | "vertical-flip" | "horizontal-flip" | ""
        disparity_range:    128
        # AR0234 sensor is 5.76 mm wide. The 1440-wide eye is center-cropped to
        # 900×900 (= 5.76 × 900/1920 = 2.7 mm) before LightStereo resizes to 320.
        sensor_width_mm:    2.7
        baseline_mm:        100.0
        focal_length_mm:    3.6
        calibration_file:   "stereo_calib.yaml"   # produced by scripts/compute_stereo_calib.py

# Fast-FoundationStereo (FFS) TRT — production stereo depth engine.
# Foundation-model-pretrained stereo network, robust on outdoor scenes,
# ~55 ms per frame on Orin NX. 320×320 input, max_disp=64, no external
# normalization. Used by node_stereo_depth_ffs (executable: stereo_depth_ffs).
# engine_file_path is relative to share/visionconnect/graphs/stereo-depth.
# The legacy LightStereo-S config block lived here too — removed once the
# launch graph migrated fully to FFS; the LightStereo engine + node remain
# available for `ros2 run` debugging but use their own internal defaults.
stereo_depth_ffs:
    ros__parameters:
        engine_file_path:       "fast_foundationstereo.engine"
        depth_vmax:             100.0    # FFS handles farther depths sensibly
        warmup_iters:           3
        sync_slop_s:            0.05
        depth_color_publish_w:  0

detect:
    ros__parameters:
        model:              "yolo26_cw.engine"   # YOLO26s end2end (NMS-free)
        labels:             "labels_detect.txt"
        # Per-class confidence thresholds (only [0] is currently consumed).
        thresholds:
            - 0.40    # all
            - 0.45    # pedestrian
            - 0.35    # cyclist
            - 0.60    # car
            - 0.45    # bus
            - 0.45    # truck
            - 0.40    # train
            - 0.25    # traffic light
            - 0.25    # traffic sign
            - 0.35    # bike (rider-less)
        track_frame_rate:   30
        track_buffer:       30

classify:
    ros__parameters:
        model:      "classify.engine"
        labels:     "labels_classify.txt"
        thresholds:
            - 0.30    # traffic light
            - 0.75    # traffic sign

lanedet:
    ros__parameters:
        model:      "lane_detect.engine"
        # Horizon crop: fraction of image height to skip from the top before
        # feeding the network. 0.5 = bottom half (legacy), 0.6 = bottom 40%,
        # etc. The model is highly sensitive to this — too much sky/dashboard
        # in the crop drops lane recall. Tune live with
        # `python3 scripts/lanedet_crop_calibrator.py` (up/down keys).
        crop_ratio: 0.60

        # Preprocessing math: (pixel − sub) / div, in RGB channel order.
        # ERFNet-CULane was trained with VGG-style BGR mean centering, which
        # in RGB-input order means sub=[123.68, 116.779, 103.939], div=1, no
        # /255 (pre_normalize=false). The legacy default was a uniform 125
        # — close to the channel average but per-channel-mismatched. Switch
        # to the BGR-mean preset for a closer match to training distribution.
        pre_sub_rgb:    [123.68, 116.779, 103.939]
        pre_div_rgb:    [1.0,    1.0,     1.0]
        pre_normalize:  false    # if true, /255 before sub/div (true ImageNet)

        # CLAHE on the cropped band (luma only, color preserved). Helps the
        # network see a stable input distribution despite camera auto-exposure
        # / lighting swings. Cheap (~0.5 ms on Orin), default off.
        clahe_enable:     false
        clahe_clip_limit: 2.0
        clahe_tile_grid:  8

gui:
    ros__parameters:
        enable_3d_boxes: false   # 3D wireframe boxes via stereo depth

bev:
    ros__parameters:
        bev_width:           480
        bev_height:          360
        pixels_per_meter:    10.0   # 10 px/m → ~48×36 m visible
        max_bev_range_m:     40.0
        camera_height_m:     1.2    # mount height (flat ground assumption)
        map_retention_sec:   30.0
        max_map_points:      10000
        enable_ground_plane: false
        render_rate_hz:      10
        gyro_alpha:          0.98   # complementary filter: gyro vs GPS heading
        # NOTE: calibration_file is injected at launch time from
        # camera_stereo.calibration_file — no need to set it here.

adas:
    ros__parameters:
        # Normalized X (0..1) position of the camera optical center within the
        # lanedet frame. Used as the split point for ego-left/ego-right lane
        # boundary selection. The physical mount on this rig is biased
        # right-of-image-center; 0.5 makes the selector treat the actual left
        # lane as the right ego boundary. Re-measure after any re-mount or
        # main_eye change: drive a straight lane and watch
        # /adas/adas_alerts.current_lane_midpoint_x under good conditions.
        ref_center_x_normalized: 0.65

driver_monitor:
    ros__parameters:
        face_engine:  "/home/jetson/VisionSense/src/graphs/face-detection/yolov11n-facefp16.engine"
        gaze_engine:  "/home/jetson/VisionSense/src/graphs/gaze-estimation/resnet18_gaze_fp16.engine"
        camera_topic: "/camera/raw"
        confidence:   0.5

sensors:
    uv_camera:              true
    zed_camera:             true
    gps_module:             true

camera:
    ros__parameters:
        resource:           "csi://0"   # IMX219 CSI mono camera for driver monitoring
        width:              1280        # HD 720p resolution
        height:             720         # HD 720p resolution

camera_stereo:
    ros__parameters:
        resource:           "/dev/video1"   # Arducam stereo camera (video1)
        width:              3840        # Full stereo width (1920 left + 1920 right)
        height:             1200        # Stereo height
        framerate:          30          # Frame rate
        disparity_range:    128         # VPI disparity range (32, 64, or 128)
        sensor_width_mm:    5.76        # Sensor width: 1920px × 3μm = 5.76mm
        flip:               "vertical"  # Flip methods: "none", "counterclockwise", "rotate-180", "clockwise", "horizontal", "vertical", "transpose", "transverse"

stereo_depth:
    ros__parameters:
        calibration_file:       "/home/jetson/jetson-stereo-depth/arducam_stereo/calibration.yaml"
        min_disparity:          0
        num_disparities:        160     # Must be divisible by 16
        block_size:             7       # Odd number for SGBM block matching
        uniqueness_ratio:       10      # Uniqueness constraint (5-15)
        speckle_window_size:    100     # Max speckle size to filter
        speckle_range:          32      # Max disparity variation in speckle
        baseline_m:             0.1016  # Baseline distance: 101.6mm
        focal_length_px:        1200.0  # Focal length in pixels
        
preview:
    ros__parameters:
        output:             "display://0"
        width:              960
        height:             540        

detect:
    ros__parameters:
        model:              "detect.engine"
        labels:             "labels_detect.txt"        
        thresholds:
            - 0.40          # Applied to all object classes
            - 0.45           # Pedestrian objects
            - 0.45          # Cyclist objects
            - 0.6           # Vehicle-car objects
            - 0.45           # Vehicle-bus objects
            - 0.45           # Vehicle-truck objects
            - 0.5           # Vehicle-train objects
            - 0.40          # Traffic light objects            
            - 0.55          # Traffic sign objects
        track_frame_rate:   30          # Frame rate for tracking
        track_buffer:       30          # Buffer size for lost tracks

classify:
    ros__parameters:
        model:               "classify.engine"
        labels:              "labels_classify.txt"
        thresholds:
            - 0.30           # Traffic Light objects
            - 0.75           # Traffic Sign objects

lanedet:
    ros__parameters:
        model:              "lane_detect.engine"


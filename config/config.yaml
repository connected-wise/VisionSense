sensors:
    uv_camera:              true
    zed_camera:             true
    gps_module:             true

camera:
    ros__parameters:
        resource:           "csi://0"   # IMX219 CSI mono camera for driver monitoring
        width:              1280        # 720p for driver monitor panel
        height:             720

camera_stereo:
    ros__parameters:
        resource:           "/dev/video1"   # Arducam stereo camera
        width:              3840        # Full stereo width (1920 left + 1920 right)
        height:             1200        # Stereo height (output will be 1200x1200 per eye)
        framerate:          30
        rotated_lenses:     false        # true: rotate 90° after split, false: no rotation
        cuda_flip:          "rotate-180" # CUDA flip (fast): "rotate-180", "vertical-flip", "horizontal-flip", or "" for none
        disparity_range:    128
        sensor_width_mm:    5.76
        baseline_mm:        100.0       # Distance between stereo lenses (mm)
        focal_length_mm:    3.6         # AR0234 M12 lens focal length (mm)

stereo_depth:
    ros__parameters:
        # Fast-FoundationStereo (single TRT engine + GWC CUDA plugin)
        engine:                 "stereo-depth/stereo_plugin_320_iters4.engine"
        plugin:                 "stereo-depth/libgwc_plugin.so"
        max_disparity:          192.0   # Must match the value baked into the engine
        warmup_iterations:      5
        baseline_mm:            100.0
        focal_length_mm:        3.6
        sensor_width_mm:        5.76
        max_depth_m:            50.0    # Max depth clamp for colorized visualization (meters)
        color_publish_size:     480     # Resolution for colorized depth visualization
        depth_publish_size:     0       # /depth topic res: 0=native source, 480=fast model-res (saves ~15ms)
preview:
    ros__parameters:
        output:             "display://0"
        width:              960
        height:             540        

detect:
    ros__parameters:
        model:              "detect.engine"
        labels:             "labels_detect.txt"        
        thresholds:
            - 0.40          # Applied to all object classes
            - 0.45           # Pedestrian objects
            - 0.45          # Cyclist objects
            - 0.6           # Vehicle-car objects
            - 0.45           # Vehicle-bus objects
            - 0.45           # Vehicle-truck objects
            - 0.5           # Vehicle-train objects
            - 0.40          # Traffic light objects            
            - 0.55          # Traffic sign objects
        track_frame_rate:   30          # Frame rate for tracking
        track_buffer:       30          # Buffer size for lost tracks

classify:
    ros__parameters:
        model:               "classify.engine"
        labels:              "labels_classify.txt"
        thresholds:
            - 0.30           # Traffic Light objects
            - 0.75           # Traffic Sign objects

lanedet:
    ros__parameters:
        model:              "lane_detect.engine"

gui:
    ros__parameters:
        enable_3d_boxes:    false       # Draw 3D wireframe boxes using stereo depth

bev:
    ros__parameters:
        bev_width:              480
        bev_height:             360
        pixels_per_meter:       10.0        # 10 px/m = ~48m x 36m visible range
        max_bev_range_m:        40.0        # Max depth to include in BEV
        camera_height_m:        1.2         # Camera mount height for flat ground assumption
        map_retention_sec:      30.0        # How long accumulated map points persist
        max_map_points:         10000       # Ring buffer capacity
        enable_ground_plane:    false       # Sparse depth ground plane sampling
        render_rate_hz:         10          # BEV rendering frequency
        gyro_alpha:             0.98        # Complementary filter: gyro vs GPS heading weight

driver_monitor:
    ros__parameters:
        face_engine:        "/home/jetson/VisionSense/src/graphs/face-detection/yolov11n-facefp16.engine"
        gaze_engine:        "/home/jetson/VisionSense/src/graphs/gaze-estimation/resnet18_gaze_fp16.engine"
        camera_topic:       "/camera/raw"
        confidence:         0.5


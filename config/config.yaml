sensors:
    uv_camera:              true
    zed_camera:             true
    gps_module:             true

camera:
    ros__parameters:
        resource:           "csi://0"   # IMX219 CSI mono camera for driver monitoring
        width:              1280        # 720p for driver monitor panel
        height:             720

camera_stereo:
    ros__parameters:
        resource:           "/dev/video1"   # Arducam stereo camera
        width:              3840        # Full stereo width (1920 left + 1920 right)
        height:             1200        # Stereo height (output will be 1200x1200 per eye)
        framerate:          30
        rotated_lenses:     true        # true: rotate 90° after split, false: no rotation
        disparity_range:    128
        sensor_width_mm:    5.76

stereo_depth:
    ros__parameters:
        model:                  "stereo-depth/LightStereo-S-KITTI.engine"
        max_disparity:          192.0
        warmup_iterations:      5
        
preview:
    ros__parameters:
        output:             "display://0"
        width:              960
        height:             540        

detect:
    ros__parameters:
        model:              "detect.engine"
        labels:             "labels_detect.txt"        
        thresholds:
            - 0.40          # Applied to all object classes
            - 0.45           # Pedestrian objects
            - 0.45          # Cyclist objects
            - 0.6           # Vehicle-car objects
            - 0.45           # Vehicle-bus objects
            - 0.45           # Vehicle-truck objects
            - 0.5           # Vehicle-train objects
            - 0.40          # Traffic light objects            
            - 0.55          # Traffic sign objects
        track_frame_rate:   30          # Frame rate for tracking
        track_buffer:       30          # Buffer size for lost tracks

classify:
    ros__parameters:
        model:               "classify.engine"
        labels:              "labels_classify.txt"
        thresholds:
            - 0.30           # Traffic Light objects
            - 0.75           # Traffic Sign objects

lanedet:
    ros__parameters:
        model:              "lane_detect.engine"

driver_monitor:
    ros__parameters:
        face_engine:        "/home/jetson/gaze-estimation/weights/yolov11n_face_fp16.engine"
        gaze_engine:        "/home/jetson/gaze-estimation/weights/resnet18_gaze_fp16.engine"
        camera_topic:       "/camera/raw"
        confidence:         0.5

